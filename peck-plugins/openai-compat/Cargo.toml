[package]
name = "peckboard-openai-compat-plugin"
version = "0.1.0"
edition = "2024"
description = "Drives sessions through any OpenAI-compatible /v1/chat/completions server (vLLM, llama.cpp, LM Studio, LocalAI, TGI, SGLang)."
repository = "https://github.com/PeckBoard/openai-compat"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_openai_compat_plugin.wasm`.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
peck-plugin-native-host = { path = "../native-host" }

[profile.release]
opt-level = "s"
lto = true
strip = true
