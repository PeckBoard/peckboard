[package]
name = "peckboard-mock-plugin"
version = "0.1.0"
edition = "2024"
description = "Scripted in-process provider for dev/test scenarios."
repository = "https://github.com/PeckBoard/mock"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_mock_plugin.wasm`.
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
