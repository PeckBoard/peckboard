[package]
name = "peckboard-claude-plugin"
version = "0.1.0"
edition = "2024"
description = "Drives sessions via the Claude CLI in stream-json mode."
repository = "https://github.com/PeckBoard/claude"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_claude_plugin.wasm`.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
peck-plugin-native-host = { path = "../native-host" }

[profile.release]
opt-level = "s"
lto = true
strip = true
