[package]
name = "peckboard-codex-plugin"
version = "0.1.0"
edition = "2024"
description = "Drives sessions via the OpenAI Codex CLI (`codex exec --json`). Sign in with ChatGPT under Settings → Codex Accounts."
repository = "https://github.com/PeckBoard/codex"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_codex_plugin.wasm`.
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
