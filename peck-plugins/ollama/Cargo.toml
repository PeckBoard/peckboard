[package]
name = "peckboard-ollama-plugin"
version = "0.1.0"
edition = "2024"
description = "Drives sessions through an Ollama server's /api/chat endpoint."
repository = "https://github.com/PeckBoard/ollama"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_ollama_plugin.wasm`.
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
