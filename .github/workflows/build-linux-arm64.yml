name: Build Linux ARM64

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release binary (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04-arm

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Ride out transient runner network/DNS failures (0.1.46 lost a
      # release to one "Could not resolve host: index.crates.io").
      CARGO_NET_RETRY: 10
      CARGO_HTTP_TIMEOUT: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web bundle
        working-directory: web
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linux-arm64

      - name: Install WebKitGTK (desktop artifact)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      # Two Linux artifacts: the CLI binary has no WebKitGTK runtime dep so a
      # VPS can still `./peckboard`. The desktop artifact links wry.
      # Pre-fetch with retries: a DNS blip on the runner otherwise fails
      # the whole build (cargo's own retries span only ~1 minute).
      - name: Fetch crates (retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do cargo fetch && exit 0; echo "fetch failed (attempt $i), retrying in 30s"; sleep 30; done; exit 1

      - name: Build CLI binary
        run: cargo build --release --no-default-features --target aarch64-unknown-linux-gnu

      - name: Stage CLI asset
        run: cp target/aarch64-unknown-linux-gnu/release/peckboard peckboard-linux-arm64

      - name: Build desktop binary
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Stage desktop asset
        run: cp target/aarch64-unknown-linux-gnu/release/peckboard peckboard-linux-arm64-desktop

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peckboard-linux-arm64
          path: |
            peckboard-linux-arm64
            peckboard-linux-arm64-desktop
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            peckboard-linux-arm64
            peckboard-linux-arm64-desktop
