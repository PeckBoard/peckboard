name: Build Windows ARM64

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Ride out transient runner network/DNS failures (0.1.46 lost a
  # release to one "Could not resolve host: index.crates.io").
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  RUST_TARGET: aarch64-pc-windows-msvc

jobs:
  build:
    name: Build aarch64-pc-windows-msvc
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_TARGET }}

      # Pre-fetch with retries: a DNS blip on the runner otherwise fails
      # the whole build (cargo's own retries span only ~1 minute).
      - name: Fetch crates (retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do cargo fetch && exit 0; echo "fetch failed (attempt $i), retrying in 30s"; sleep 30; done; exit 1

      - name: Build release binary
        run: cargo build --release --target ${{ env.RUST_TARGET }}

      - name: Stage release asset
        run: Copy-Item target/${{ env.RUST_TARGET }}/release/peckboard.exe peckboard-windows-arm64.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: peckboard-windows-arm64
          path: peckboard-windows-arm64.exe
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: peckboard-windows-arm64.exe
