name: Build Main

# Builds the release binaries for every push to main and stores them as run
# artifacts. Releasing is then a promotion, not a build: the tag-triggered
# "Publish Release" workflow finds this run by commit SHA, downloads the
# artifacts, and attaches them to the release in under a minute. This
# workflow also saves the cargo caches under the default-branch scope
# (tag-ref caches are invisible to other tags, so caches saved here are the
# only ones a fallback tag-time build could ever restore).
#
# No paths filter on purpose: the binaries embed web/dist (rust-embed), so
# a web-only change still needs fresh artifacts — filtering by path risks
# promoting a stale binary.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors the release asset set. Keep cache keys stable — the
          # (dispatch-only) per-OS build workflows share them.
          - asset: peckboard-linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cargo_flags: --no-default-features
            cache_key: linux-x86_64-cli
            webkit: false
          - asset: peckboard-linux-x86_64-desktop
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cargo_flags: ""
            cache_key: linux-x86_64-desktop
            webkit: true
          - asset: peckboard-macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            cargo_flags: ""
            cache_key: macos-arm64
            webkit: false
          - asset: peckboard-windows-x86_64.exe
            os: windows-2025
            target: x86_64-pc-windows-msvc
            cargo_flags: ""
            cache_key: windows-x86_64
            webkit: false

    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Ride out transient runner network/DNS failures (0.1.46 lost a
      # release to one "Could not resolve host: index.crates.io").
      CARGO_NET_RETRY: 10
      CARGO_HTTP_TIMEOUT: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web bundle
        working-directory: web
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.cache_key }}

      - name: Install WebKitGTK (desktop artifact)
        if: matrix.webkit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      # Pre-fetch with retries: a DNS blip on the runner otherwise fails
      # the whole build (cargo's own retries span only ~1 minute).
      - name: Fetch crates (retry)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do cargo fetch && exit 0; echo "fetch failed (attempt $i), retrying in 30s"; sleep 30; done; exit 1

      - name: Build binary
        run: cargo build --release ${{ matrix.cargo_flags }} --target ${{ matrix.target }}

      - name: Stage asset
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/peckboard ${{ matrix.asset }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item target/${{ matrix.target }}/release/peckboard.exe ${{ matrix.asset }}

      - name: Checksum
        if: runner.os == 'Linux'
        run: sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Checksum (macOS)
        if: runner.os == 'macOS'
        run: shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        run: "(Get-FileHash ${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower() + '  ${{ matrix.asset }}' | Out-File -Encoding ascii -NoNewline ${{ matrix.asset }}.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error
