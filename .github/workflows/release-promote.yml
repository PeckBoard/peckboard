name: Publish Release

# The sub-minute release path: a tag does not build anything. It finds the
# "Build Main" and "Build Agent" runs for the tagged commit, downloads their
# artifacts, and attaches them to the release. Building already happened on
# the main push (see build-main.yml and build-agent.yml). If the tag lands
# while those builds are still running, this job waits for them — worst case
# it degrades to the old wall-clock, it never publishes a stale or missing
# asset.
#
# Two phases, because the Windows core build is the slowest matrix job by a
# wide margin (~9.5 min of codegen on a 4-vCPU runner vs ~6.5 min macOS and
# ~3.5 min Linux) and used to gate the whole release:
#
#   promote          waits for every Build Main job EXCEPT Windows, plus the
#                    Build Agent run, and publishes the release with those
#                    assets. The release is live as soon as macOS finishes.
#   attach-windows   waits for the Windows job of that same Build Main run
#                    and uploads its asset onto the already-published release.
#
# Self-update (src/service/update.rs) only offers a release once the asset
# for the running platform is attached, so a Windows install polling in the
# gap simply sees "no update yet" rather than a 404 mid-upgrade. If the
# Windows job fails, attach-windows goes red and the release stays live
# without the Windows asset; run build-windows-x86_64.yml against the tag to
# rebuild and publish it.
#
# A tag containing '-' (0.0.191-rc1) publishes as a prerelease, which
# `releases/latest` — what self-update reads — ignores.
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  actions: read

env:
  # Must match the `asset:` names in build-main.yml — they double as the
  # artifact names `gh run download -n` selects.
  WINDOWS_ASSET: peckboard-windows-x86_64.exe
  # Core assets the first phase publishes: every build-main.yml asset except
  # the Windows one.
  CORE_ASSETS: >-
    peckboard-linux-x86_64
    peckboard-linux-x86_64-desktop
    peckboard-macos-arm64

jobs:
  promote:
    name: Promote main-build artifacts to release
    runs-on: ubuntu-24.04
    outputs:
      main_run_id: ${{ steps.find_main.outputs.run_id }}

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The binaries were stamped from Cargo.toml on the main push (shallow
      # branch clones carry no tags, so build.rs cannot see a future tag).
      # Refuse to publish a tag that disagrees with that stamp — shipping the
      # mismatch breaks self-update on every installed copy (0.0.191 shipped
      # stamped 0.1.0, which compares newer than every real release).
      - name: Tag must match Cargo.toml version
        run: |
          want="${GITHUB_REF_NAME%%-*}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$have" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $have — bump Cargo.toml in the release commit before tagging."
            exit 1
          fi

      # Gate on the run's JOBS, not its conclusion: the run stays
      # `in_progress` until Windows finishes, but every other artifact is
      # already uploaded and downloadable by name.
      - name: Wait for the tagged commit's Build Main jobs (all but Windows)
        id: find_main
        run: |
          for i in $(seq 90); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-main.yml/runs?head_sha=$GITHUB_SHA&per_page=5" \
              --jq '.workflow_runs | sort_by(.run_started_at) | reverse | first // empty')
            if [ -z "$run" ]; then
              echo "no Build Main run for $GITHUB_SHA yet — was main pushed before tagging?"
            else
              id=$(jq -r '.id' <<<"$run")
              jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=50" \
                --jq "[.jobs[] | select(.name != \"Build $WINDOWS_ASSET\")]")
              total=$(jq 'length' <<<"$jobs")
              done_ok=$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$jobs")
              bad=$(jq -r '.[] | select(.status == "completed" and .conclusion != "success") | "\(.name): \(.conclusion)"' <<<"$jobs")
              echo "Build Main run $id: $done_ok/$total non-Windows jobs succeeded"
              if [ -n "$bad" ]; then
                echo "Build Main for $GITHUB_SHA has failed jobs — refusing to promote its artifacts:"
                echo "$bad"
                exit 1
              fi
              # `total` can be 0 for a moment while the matrix is still
              # being expanded; keep waiting until the jobs exist.
              if [ "$total" -gt 0 ] && [ "$done_ok" -eq "$total" ]; then
                echo "run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Timed out waiting for Build Main of $GITHUB_SHA (30 min)."
          exit 1

      - name: Wait for the tagged commit's Build Agent run
        id: find_agent
        run: |
          for i in $(seq 90); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-agent.yml/runs?head_sha=$GITHUB_SHA&per_page=5" \
              --jq '.workflow_runs | sort_by(.run_started_at) | reverse | first // empty')
            if [ -z "$run" ]; then
              echo "no Build Agent run for $GITHUB_SHA yet — was main pushed before tagging?"
            else
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              id=$(jq -r '.id' <<<"$run")
              echo "Build Agent run $id: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "Build Agent for $GITHUB_SHA concluded '$conclusion' — refusing to promote its artifacts."
                  exit 1
                fi
                echo "run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Timed out waiting for Build Agent of $GITHUB_SHA (30 min)."
          exit 1

      # By name, one artifact at a time: the run is still in progress
      # (Windows), and a whole-run download would pick up whatever happens
      # to exist rather than exactly the set this phase promises.
      - name: Download core artifacts (all but Windows)
        run: |
          for asset in $CORE_ASSETS; do
            gh run download "${{ steps.find_main.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" -n "$asset" --dir "assets/$asset"
          done

      - name: Download agent artifacts
        run: gh run download "${{ steps.find_agent.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --dir assets

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*/*

  attach-windows:
    name: Attach the Windows asset once its build finishes
    runs-on: ubuntu-24.04
    needs: promote

    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_RUN_ID: ${{ needs.promote.outputs.main_run_id }}

    steps:
      - name: Wait for the Windows job of Build Main run
        run: |
          for i in $(seq 90); do
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_RUN_ID/jobs?per_page=50" \
              --jq ".jobs[] | select(.name == \"Build $WINDOWS_ASSET\")")
            if [ -z "$job" ]; then
              echo "Build Main run $MAIN_RUN_ID has no job named 'Build $WINDOWS_ASSET' — did build-main.yml rename its assets?"
              exit 1
            fi
            status=$(jq -r '.status' <<<"$job")
            conclusion=$(jq -r '.conclusion // ""' <<<"$job")
            echo "Windows job: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Windows build for $GITHUB_SHA concluded '$conclusion'. The release is live without $WINDOWS_ASSET — run build-windows-x86_64.yml against tag $GITHUB_REF_NAME to rebuild and publish it."
                exit 1
              fi
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for the Windows job of Build Main $MAIN_RUN_ID (30 min)."
          exit 1

      - name: Download the Windows artifact
        run: gh run download "$MAIN_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$WINDOWS_ASSET" --dir assets

      # --clobber so a re-run of this job after a partial upload converges
      # instead of failing on "asset already exists".
      - name: Upload onto the published release
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "assets/$WINDOWS_ASSET" "assets/$WINDOWS_ASSET.sha256"
