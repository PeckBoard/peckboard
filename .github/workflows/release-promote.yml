name: Publish Release

# A tag does not build anything. It finds the "Build Main" and "Build Agent"
# runs for the tagged commit, downloads their artifacts, and attaches them to
# the release. Building already happened on the main push (see build-main.yml
# and build-agent.yml). If the tag lands while those builds are still
# running, these jobs wait for them. They never publish a stale or missing
# asset.
#
# The release goes live on the FASTEST core build, and every slower one is
# attached as it lands. Typical Build Main job times (4-vCPU hosted runners):
#
#   linux-x86_64           ~3.7 min   <- gates the release
#   linux-x86_64-desktop   ~5.2 min   (WebKitGTK install + bigger link)
#   macos-arm64            ~6.6 min
#   windows-x86_64         ~9 min
#
#   promote        waits for the Linux CLI job and the Build Agent run, then
#                  publishes the release with those assets.
#   attach-late    one matrix leg per slower core asset: waits for that job
#                  of the same Build Main run and uploads its asset onto the
#                  already-published release.
#
# Self-update (src/service/update.rs) only offers a release once the asset
# for the running platform AND its .sha256 are attached, so a macOS or
# Windows install polling in the gap sees "no update yet" rather than a 404
# mid-upgrade. If a late job fails, its attach-late leg goes red and the
# release stays live without that asset. Run the matching
# build-<platform>.yml against the tag to rebuild and publish it.
#
# A tag containing '-' (0.0.191-rc1) publishes as a prerelease, which
# `releases/latest` (what self-update reads) ignores.
on:
  push:
    tags: ["*"]

permissions:
  contents: write
  actions: read

env:
  # Must match an `asset:` name in build-main.yml. The Build Main job is
  # named "Build <asset>", and the artifact is named <asset>.
  FIRST_ASSET: peckboard-linux-x86_64

jobs:
  promote:
    name: Promote main-build artifacts to release
    runs-on: ubuntu-24.04
    outputs:
      main_run_id: ${{ steps.find_main.outputs.run_id }}

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The binaries were stamped from Cargo.toml on the main push (shallow
      # branch clones carry no tags, so build.rs cannot see a future tag).
      # Refuse to publish a tag that disagrees with that stamp — shipping the
      # mismatch breaks self-update on every installed copy (0.0.191 shipped
      # stamped 0.1.0, which compares newer than every real release).
      - name: Tag must match Cargo.toml version
        run: |
          want="${GITHUB_REF_NAME%%-*}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$have" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $have — bump Cargo.toml in the release commit before tagging."
            exit 1
          fi

      # Gate on one JOB, not the run's conclusion: the run stays
      # `in_progress` until its slowest leg finishes, but a finished job's
      # artifact is already uploaded and downloadable by name.
      - name: Wait for the tagged commit's Build Main Linux job
        id: find_main
        run: |
          for i in $(seq 180); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-main.yml/runs?head_sha=$GITHUB_SHA&per_page=5" \
              --jq '.workflow_runs | sort_by(.run_started_at) | reverse | first // empty')
            if [ -z "$run" ]; then
              echo "no Build Main run for $GITHUB_SHA yet — was main pushed before tagging?"
            else
              id=$(jq -r '.id' <<<"$run")
              job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=50" \
                --jq ".jobs[] | select(.name == \"Build $FIRST_ASSET\")")
              # Empty while the matrix is still being expanded.
              [ -n "$job" ] || job='{"status":"queued"}'
              status=$(jq -r '.status' <<<"$job")
              conclusion=$(jq -r '.conclusion // ""' <<<"$job")
              echo "Build Main run $id, job 'Build $FIRST_ASSET': status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "Build $FIRST_ASSET concluded '$conclusion' — refusing to publish."
                  exit 1
                fi
                echo "run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for Build Main of $GITHUB_SHA (30 min)."
          exit 1

      - name: Wait for the tagged commit's Build Agent run
        id: find_agent
        run: |
          for i in $(seq 180); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-agent.yml/runs?head_sha=$GITHUB_SHA&per_page=5" \
              --jq '.workflow_runs | sort_by(.run_started_at) | reverse | first // empty')
            if [ -z "$run" ]; then
              echo "no Build Agent run for $GITHUB_SHA yet — was main pushed before tagging?"
            else
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              id=$(jq -r '.id' <<<"$run")
              echo "Build Agent run $id: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "Build Agent for $GITHUB_SHA concluded '$conclusion' — refusing to promote its artifacts."
                  exit 1
                fi
                echo "run_id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for Build Agent of $GITHUB_SHA (30 min)."
          exit 1

      - name: Download the Linux core artifact
        run: gh run download "${{ steps.find_main.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" -n "$FIRST_ASSET" --dir "assets/$FIRST_ASSET"

      - name: Download agent artifacts
        run: gh run download "${{ steps.find_agent.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --dir assets

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: assets/*/*

  attach-late:
    name: Attach ${{ matrix.asset }}
    runs-on: ubuntu-24.04
    needs: promote

    strategy:
      fail-fast: false
      matrix:
        # Every build-main.yml asset except FIRST_ASSET.
        asset:
          - peckboard-linux-x86_64-desktop
          - peckboard-macos-arm64
          - peckboard-windows-x86_64.exe

    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_RUN_ID: ${{ needs.promote.outputs.main_run_id }}
      ASSET: ${{ matrix.asset }}

    steps:
      - name: Wait for the Build Main job
        run: |
          for i in $(seq 180); do
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_RUN_ID/jobs?per_page=50" \
              --jq ".jobs[] | select(.name == \"Build $ASSET\")")
            if [ -z "$job" ]; then
              echo "Build Main run $MAIN_RUN_ID has no job named 'Build $ASSET' — did build-main.yml rename its assets?"
              exit 1
            fi
            status=$(jq -r '.status' <<<"$job")
            conclusion=$(jq -r '.conclusion // ""' <<<"$job")
            echo "Build $ASSET: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Build $ASSET for $GITHUB_SHA concluded '$conclusion'. The release is live without $ASSET — run the matching build-*.yml against tag $GITHUB_REF_NAME to rebuild and publish it."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Build $ASSET of Build Main $MAIN_RUN_ID (30 min)."
          exit 1

      - name: Download the artifact
        run: gh run download "$MAIN_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$ASSET" --dir assets

      # --clobber so a re-run after a partial upload converges instead of
      # failing on "asset already exists".
      - name: Upload onto the published release
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "assets/$ASSET" "assets/$ASSET.sha256"
