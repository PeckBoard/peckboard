[package]
name = "peckboard-relay"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Handshake-only rendezvous server: introduces a user's device to their
# Peckboard box, then gets out of the way — all traffic flows directly
# between the two over UDP hole punching. The relay never carries user
# traffic and only ever sees opaque E2E-sealed blobs.
#
# Standalone crate (root is a package, not a workspace — same as
# `peckboard-agent`). Build/test with
# `--manifest-path peckboard-relay/Cargo.toml`.

[[bin]]
name = "peckboard-relay"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["client"]
# Peer-side library (derive keys, register, STUN, punch, E2E box) reused by
# the Peckboard box and the `peckboard connect` CLI.
client = []
# Direct box<->device data path: QUIC over the hole-punched UDP socket,
# mutually authenticated with keys derived from the pairing secret, plus the
# device reconnect loop (`run_device`, cancellable) and its cookie gate.
tunnel = ["client", "dep:quinn", "dep:base64", "dep:rcgen", "dep:tokio-util"]
# The relay server itself (`server`/`tls`/`limits` modules + the binary):
# ACME, CLI and log-subscriber deps that peers never need.
server = [
  "dep:rustls-acme",
  "dep:rcgen",
  "dep:clap",
  "dep:tracing-subscriber",
  "dep:tokio-util",
  "dep:futures-util",
]

[[example]]
name = "box_forward"
required-features = ["tunnel"]

[[example]]
name = "live_check"
required-features = ["client"]

[[test]]
name = "tunnel"
required-features = ["tunnel", "server"]

[[test]]
name = "rendezvous"
required-features = ["client", "server"]

[[test]]
name = "relay_fallback"
required-features = ["tunnel", "server"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

# TLS 1.3 only, ring backend (pure static musl build, no cmake / aws-lc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "webpki-roots", "tokio"], optional = true }
rcgen = { version = "0.13", optional = true }
webpki-roots = "1"

# Pairing-secret derivation, membership proof, E2E box, STUN integrity.
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha1 = "0.10"
subtle = "2.6"
rand = "0.8"

clap = { version = "4", features = ["derive", "env"], optional = true }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
