<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Register your PeckBoard box</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 2rem 1rem;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 1rem;
      }
      p {
        margin: 0 0 1rem;
      }
      code {
        font:
          0.85rem/1.4 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        word-break: break-all;
        padding: 0.4rem 0.5rem;
        border-radius: 4px;
        background: rgba(127, 127, 127, 0.15);
        display: block;
      }
      button {
        font: inherit;
        padding: 0.5rem 1.25rem;
        border-radius: 6px;
        border: 1px solid rgba(127, 127, 127, 0.5);
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      progress {
        width: 100%;
        height: 0.5rem;
      }
      #status {
        min-height: 1.5rem;
      }
      .ok {
        color: #1a7f37;
        font-weight: 600;
      }
      .err {
        color: #cf222e;
        font-weight: 600;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Register your PeckBoard box</h1>
      <p>
        Registering lets this box use the relayed connection when a direct
        connection to your devices isn't possible. Direct connections work
        without registering.
      </p>
      <div id="box" hidden>
        <p>Box key:</p>
        <p><code id="key"></code></p>
        <p><button id="go" type="button">Register</button></p>
        <progress id="bar" max="1" value="0" hidden></progress>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      "use strict";
      (function () {
        var status = document.getElementById("status");
        var go = document.getElementById("go");
        var bar = document.getElementById("bar");
        function say(text, cls) {
          status.textContent = text;
          status.className = cls || "";
        }
        var key = "";
        try {
          key = decodeURIComponent(location.hash.slice(1)).trim();
        } catch (e) {
          key = "";
        }
        if (!/^[A-Za-z0-9_-]{43}$/.test(key)) {
          say(
            "This link has no valid box key. Open the registration link from your PeckBoard box's settings.",
            "err",
          );
          return;
        }
        if (!(window.crypto && crypto.subtle)) {
          say(
            "This browser can't run the registration check (no WebCrypto). Try another browser.",
            "err",
          );
          return;
        }
        document.getElementById("key").textContent = key;
        document.getElementById("box").hidden = false;

        function getJson(url, opts) {
          return fetch(
            url,
            Object.assign(
              { cache: "no-store", credentials: "omit" },
              opts || {},
            ),
          ).then(function (r) {
            return r
              .json()
              .catch(function () {
                return {};
              })
              .then(function (j) {
                if (!r.ok) {
                  throw new Error(j.error || "HTTP " + r.status);
                }
                return j;
              });
          });
        }

        function zeroBits(buf) {
          var b = new Uint8Array(buf),
            n = 0;
          for (var i = 0; i < b.length; i++) {
            if (b[i] === 0) {
              n += 8;
              continue;
            }
            return n + Math.clz32(b[i]) - 24;
          }
          return n;
        }

        // Find a counter whose sha256("peckrelay-register:<nonce>:<key>:<n>") has
        // `bits` leading zero bits. Batches of digests keep WebCrypto busy.
        function solve(nonce, bits) {
          var enc = new TextEncoder();
          var prefix = "peckrelay-register:" + nonce + ":" + key + ":";
          var expected = Math.pow(2, bits),
            n = 0,
            batch = 1024;
          bar.hidden = false;
          function round() {
            var jobs = [];
            for (var i = 0; i < batch; i++) {
              jobs.push(
                crypto.subtle.digest("SHA-256", enc.encode(prefix + (n + i))),
              );
            }
            return Promise.all(jobs).then(function (hashes) {
              for (var i = 0; i < hashes.length; i++) {
                if (zeroBits(hashes[i]) >= bits) {
                  return String(n + i);
                }
              }
              n += batch;
              bar.value = 1 - Math.exp(-n / expected);
              return round();
            });
          }
          return round();
        }

        // POST, so the key stays out of the request line.
        getJson("/api/registered", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: key }),
        })
          .then(function (j) {
            if (j.registered) {
              say("This box is already registered.", "ok");
              go.disabled = true;
            }
          })
          .catch(function () {});

        go.addEventListener("click", function () {
          go.disabled = true;
          say("Checking you're a person, not a script (a few seconds)…");
          getJson("/api/register/challenge")
            .then(function (c) {
              return solve(c.nonce, c.difficulty).then(function (solution) {
                bar.value = 1;
                say("Registering…");
                var body = new URLSearchParams({
                  key: key,
                  nonce: c.nonce,
                  solution: solution,
                });
                return getJson("/api/register", { method: "POST", body: body });
              });
            })
            .then(function () {
              bar.hidden = true;
              say(
                "Registered. Your box can now use the relayed connection; you can close this page.",
                "ok",
              );
            })
            .catch(function (e) {
              bar.hidden = true;
              go.disabled = false;
              say("Registration failed: " + e.message + ". Try again.", "err");
            });
        });
      })();
    </script>
  </body>
</html>
