title: PeckBoard
description: Self-hosted mission control for AI agents — a board the dispatcher works for you, orchestrators that drive sessions toward a goal, and subagents streaming live in split panes.
baseurl: ""
url: "https://peckboard.com"

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

color_scheme: peckboard

aux_links:
  GitHub:
    - "https://github.com/PeckBoard/peckboard"

footer_content: "Assembled with many small pecks."

mermaid:
  version: "10.9.1"

# Universal Links (iOS) / App Links (Android) for pairing links: Jekyll
# skips dot-paths unless listed here.
include:
  - .well-known

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - node_modules/
  # Internal development docs, not part of the public site.
  - EPIC.md
  - api/
  - architecture/
  - frontend/
  - tasks/
  - proposals/
