[package]
name = "peckboard-team-format"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The team membership log: record format, the rules for who may change a
# team, and invite links. Shared by PeckBoard (every member server replays
# and checks the log itself) and `peckboard-skills-hub` (which stores it and
# refuses a bad record), so both judge a team exactly the same way.
#
# No signature library in here: callers pass their own Ed25519 check, so
# each side keeps the crypto crate it already uses.
#
# Standalone crate (the repo root is a package, not a workspace). Test with
# `cargo test --manifest-path peckboard-team-format/Cargo.toml`.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
