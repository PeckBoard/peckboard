[package]
name = "peckboard-skills-hub"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The public skills server PeckBoard instances publish to and read the
# public catalog (`index.json`) from. Publishers are identified by an
# Ed25519 key; every publish is signed over a single-use server nonce and
# screened by the same parser + proprietary-content guard PeckBoard runs
# (`peckboard-skill-format`).
#
# Standalone crate (the repo root is a package, not a workspace — same as
# `peckboard-relay`). Build/test with
# `--manifest-path peckboard-skills-hub/Cargo.toml`.

[[bin]]
name = "peckboard-skills-hub"
path = "src/main.rs"

[dependencies]
peckboard-skill-format = { path = "../peckboard-skill-format" }
peckboard-team-format = { path = "../peckboard-team-format" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
axum = "0.8"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }

# TLS 1.3 only, ring backend (pure static musl build, no cmake / aws-lc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "webpki-roots", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# Skill storage: one bare repo per skill / fork. Vendored libgit2 (static,
# no OpenSSL / libssh2: repos are only ever read and fetched locally).
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
# Nightly backup of the repos dir (pure Rust).
tar = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
